name: CI

on: [push,pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ODExplorer.sln
      - name: Build
        run: dotnet build ODExplorer.sln -c Release --no-restore
      - name: Build TestApp
        run: dotnet run --project src/TestApp/TestApp.csproj -c Release --no-build
